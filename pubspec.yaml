name: classio_app
description: Planificador académico universitario offline-first
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado y Arquitectura
  flutter_riverpod: ^2.5.1

  # Almacenamiento Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Moderna y Animaciones
  flutter_animate: ^4.5.0         # Animaciones fluidas y modernas
  
  # Componentes UI Premium
  google_fonts: ^6.2.1            # Fuentes modernas de Google
  flutter_slidable: ^3.1.0        # Swipe actions elegantes
  badges: ^3.1.2                  # Badges modernos
  
  # Calendario y Gráficos
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  
  # Notificaciones
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Tour y Onboarding
  intro_slider: ^4.2.1
  tutorial_coach_mark: ^1.2.11

  # Utilidades
  uuid: ^4.5.1
  equatable: ^2.0.5
  intl: ^0.19.0
  url_launcher: ^6.3.1
  
  # Iconos Premium
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8                 # Iconos modernos y elegantes

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Configuración del ícono de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  
  # Configuración para Android
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  
  # Configuración para iOS
  remove_alpha_ios: true
