name: classio_app
description: Planificador académico universitario offline-first
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado y Arquitectura
  flutter_riverpod: ^2.5.1

  # Almacenamiento Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Moderna y Animaciones
  animate_do: ^3.3.4              # Animaciones predefinidas elegantes
  flutter_animate: ^4.5.0         # Animaciones fluidas y modernas
  shimmer: ^3.0.0                 # Loading skeletons modernos
  flutter_staggered_animations: ^1.1.1  # Animaciones escalonadas
  
  # Componentes UI Premium
  google_fonts: ^6.2.1            # Fuentes modernas de Google
  flutter_slidable: ^3.1.0        # Swipe actions elegantes
  flutter_speed_dial: ^7.0.0      # FAB con opciones
  badges: ^3.1.2                  # Badges modernos
  
  # Calendario y Gráficos
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.14  # Gráficos profesionales
  
  # Notificaciones
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utilidades
  uuid: ^4.5.1
  equatable: ^2.0.5
  intl: ^0.19.0
  
  # Iconos Premium
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8                 # Iconos modernos y elegantes
  phosphor_flutter: ^2.1.0        # Iconos minimalistas premium

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
